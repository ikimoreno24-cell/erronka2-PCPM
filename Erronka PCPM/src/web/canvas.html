<!DOCTYPE html>
<html>
<head>
<title>Explosión de Confeti al Clic</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #1a1a1a; cursor: pointer; } /* Cursor cambia para indicar clic */
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<script>
  // --- Inicialización del Canvas y Contexto ---
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let confettis = []; // Array que contendrá todos los confetis activos

  // --- Clase Confeti ---
  // (La lógica del confeti se mantiene para garantizar el máximo alcance)
  class Confetto {
    constructor(startX, startY) {
      this.x = startX;
      this.y = startY;
      
      this.size = Math.random() * 6 + 4; 
      this.color = this.getRandomColor();
      
      const angle = Math.random() * Math.PI * 2; 
      // Máxima velocidad para el mayor alcance posible
      const initialSpeed = Math.random() * 15 + 10; 

      this.speedX = Math.cos(angle) * initialSpeed;
      this.speedY = Math.sin(angle) * initialSpeed;
      
      this.gravity = 0.05; 
      this.deceleration = 0.99; 
      this.rotation = Math.random() * 360;
      this.rotationSpeed = Math.random() * 0.2 - 0.1;

      this.opacity = 1;
      this.fadeSpeed = 0.003; 
    }

    getRandomColor() {
      const colors = ['#FF00A2', '#00FFFF', '#FFCC00', '#FFFFFF', '#C0C0C0', '#33CC33', '#FF6600', '#8A2BE2', '#DC143C'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
      this.speedY += this.gravity;
      this.speedX *= this.deceleration;
      this.speedY *= this.deceleration;

      this.y += this.speedY;
      this.x += this.speedX;
      this.rotation += this.rotationSpeed;
      
      this.opacity -= this.fadeSpeed;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
      
      ctx.restore();
      ctx.globalAlpha = 1; 
    }
  }

  // --- Función para crear una Explosión (Acepta posición del clic) ---
  const confettiCount = 500; 
  
  function createExplosion(clickX, clickY) {
    // Si no se pasan coordenadas, usa el centro (para una explosión inicial si la necesitas)
    const startX = clickX || canvas.width / 2;
    const startY = clickY || canvas.height / 2;

    // Generamos 500 nuevos confetis
    for (let i = 0; i < confettiCount; i++) {
      // Pequeño desplazamiento inicial
      const offsetX = (Math.random() - 0.5) * 50; 
      const offsetY = (Math.random() - 0.5) * 50; 
      
      confettis.push(new Confetto(startX + offsetX, startY + offsetY));
    }
  }

  // --- Bucle de Animación ---
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    // Filtra (elimina) los confetis que ya se han desvanecido por completo
    confettis = confettis.filter(c => c.opacity > 0); 

    confettis.forEach(confetto => {
      confetto.update();
      confetto.draw();
    });
    
    requestAnimationFrame(animate); 
  }

  // --- Control de Eventos de Clic (El cambio clave) ---
  
  // Añadimos un "escuchador de eventos" que detecta cualquier clic en la ventana
  window.addEventListener('click', (event) => {
    // Cuando hay un clic, llamamos a createExplosion
    // Le pasamos las coordenadas 'event.clientX' y 'event.clientY'
    createExplosion(event.clientX, event.clientY);
  });

  // Iniciamos el bucle de animación
  animate();
</script>

</body>
</html>
